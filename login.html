<html data-design="editorial" lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 历史研究数据库</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    
    <!-- 界面转场效果 -->
    <link rel="stylesheet" href="transitions.css">
    
    <style>
        /* 保留与主页面一致的配色方案 */
        :root {
            --base-1: #FFF7F1;
            --base-2: #FFE4C9;
            --accent-1: #E78895;
            --accent-2: #BED1CF;
            --text-primary: #8C454F;
            --text-secondary: #4F6B68;
            --radius-medium: 16px;
            --ease-smooth: cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, var(--base-1) 0%, var(--base-2) 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            background: white;
            border-radius: var(--radius-medium);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(140, 69, 79, 0.15);
        }

        .auth-left {
            flex: 1;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .auth-left::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23ffffff' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .auth-left h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .auth-left p {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
            max-width: 500px;
            position: relative;
            z-index: 1;
        }

        .auth-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px;
            background: white;
        }

        .auth-form {
            width: 100%;
            max-width: 400px;
        }

        .auth-form h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-primary);
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            border-radius: var(--radius-medium);
            border: 1px solid rgba(140, 69, 79, 0.2);
            background: white;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.4s var(--ease-smooth);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent-1);
            box-shadow: 0 0 0 2px rgba(231, 136, 149, 0.2);
        }

        .btn {
            padding: 12px 24px;
            border-radius: var(--radius-medium);
            cursor: pointer;
            transition: all 0.4s var(--ease-smooth);
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            outline: none;
            text-decoration: none;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(231, 136, 149, 0.3);
        }

        .btn-outline {
            background: white;
            color: var(--accent-1);
            border: 2px solid var(--accent-1);
        }

        .btn-outline:hover {
            background: var(--accent-1);
            color: white;
        }

        .loading {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 247, 241, 0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            border: 4px solid rgba(231, 136, 149, 0.2);
            border-radius: 50%;
            border-top: 4px solid var(--accent-1);
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #ff4444;
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .feature-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .feature-text h3 {
            margin-bottom: 5px;
        }

        .feature-text p {
            opacity: 0.8;
            font-size: 14px;
            margin: 0;
        }

        @media (max-width: 768px) {
            .auth-container {
                flex-direction: column;
                min-height: auto;
            }
            
            .auth-left {
                padding: 40px 20px;
            }
            
            .auth-right {
                padding: 40px 20px;
            }
            
            .auth-left h1 {
                font-size: 2.2rem;
            }
        }

        /* ========== 性能模式：移动/触摸设备自动启用 ========== */
        body.performance-mode .stat-card,
        body.performance-mode .content-card,
        body.performance-mode .data-table,
        body.performance-mode .btn,
        body.performance-mode .glass-surface,
        body.performance-mode .glass-container,
        body.performance-mode .auth-container {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            transform: none !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08) !important;
            border: 1px solid rgba(var(--accent-1-rgb, 231, 136, 149), 0.2) !important;
            transition: none !important;
        }
        body.performance-mode .stat-card::before,
        body.performance-mode .stat-card::after,
        body.performance-mode .content-card::before,
        body.performance-mode .liquid-glass::before,
        body.performance-mode .liquid-glass::after,
        body.performance-mode .glass-container::before,
        body.performance-mode .glass-container::after,
        body.performance-mode .auth-container::before,
        body.performance-mode .auth-container::after {
            display: none !important;
        }
        body.performance-mode .parallax-layer-1,
        body.performance-mode .parallax-layer-2,
        body.performance-mode .parallax-layer-3 {
            translate: none !important;
            transform: none !important;
        }

        /* 性能模式下进一步简化认证容器的阴影与动画 */
        body.performance-mode .auth-container {
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            animation: none !important;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1) !important;
        }

        /* 移动端触摸优化：增大点击区域与内边距 */
        @media (max-width: 768px) {
            .auth-left {
                padding: 30px 20px;
            }
            .auth-left h1 {
                font-size: 2rem;
            }
            .auth-right {
                padding: 30px 20px;
            }
            .btn {
                padding: 14px 20px;
            }
        }
    </style>
    <script>
        // 性能模式自动启用：小屏幕或触摸设备
        (function () {
            function applyPerformanceMode() {
                var isSmallScreen = window.innerWidth <= 768;
                var isTouchDevice = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
                if (isSmallScreen || isTouchDevice) {
                    if (document.body) {
                        document.body.classList.add('performance-mode');
                    }
                    try {
                        localStorage.setItem('performanceMode', '1');
                    } catch (e) {}
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', applyPerformanceMode);
            } else {
                applyPerformanceMode();
            }
        })();
    </script>

    <link rel="stylesheet" href="css/editorial.css">
    <link rel="stylesheet" href="css/refined.css">

    <link rel="stylesheet" href="css/research-fonts.css">
    <link rel="stylesheet" href="css/reading-focus.css">
    <link rel="stylesheet" href="css/apple-inspired.css">

    <script src="js/v3/workspace.js" defer></script>
    <script src="js/v3/presentation.js" defer></script>
</head>
<body>
    <!-- Liquid Glass SVG Filters (hidden defs) -->
    <svg class="liquid-glass-svg-defs" aria-hidden="true" focusable="false">
        <filter id="liquidGlassDistortion" x="-30%" y="-30%" width="160%" height="160%">
            <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="2" result="noise">
                <animate attributeName="baseFrequency" dur="10s"
                         values="0.012 0.018; 0.018 0.012; 0.012 0.018" repeatCount="indefinite" />
                <animate attributeName="seed" dur="12s"
                         values="2; 8; 2" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="18"
                               xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <div id="loadingText" style="margin-top: 15px; color: var(--text-primary);">正在验证...</div>
    </div>

    <div class="auth-container auth-page-enter">
        <div class="auth-left">
            <div class="ed-eyebrow">THE RESEARCH ARCHIVE</div>
            <h1>史料 · 研究</h1>
            <p>整理历史的片段，建立思想的联系。<br>在这里，继续你的阅读、摘录与研究。</p>
            
            <div style="margin-top: 40px;">
                <div class="feature-item">
                    <div class="feature-icon">01</div>
                    <div class="feature-text">
                        <h3>整理与检索</h3>
                        <p>用类型、标签与日期连接研究材料</p>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">02</div>
                    <div class="feature-text">
                        <h3>阅读与写作</h3>
                        <p>保留原文，记录分析、出处与批注</p>
                    </div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">03</div>
                    <div class="feature-text">
                        <h3>保存与回溯</h3>
                        <p>自动草稿、云端同步与历史版本</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="auth-right">
            <div class="auth-form">
                <h2>欢迎回来</h2>
                <div id="errorMessage" class="error-message"></div>
                <div class="form-group">
                    <label class="form-label" for="emailInput">电子邮箱</label>
                    <input type="email" id="emailInput" autocomplete="username" class="form-input" placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="passwordInput">密码</label>
                    <input type="password" id="passwordInput" autocomplete="current-password" class="form-input" placeholder="输入您的密码" onkeydown="if(event.key==='Enter'&&!event.isComposing)handleLogin()">
                </div>
                <button onclick="handleLogin()" class="btn btn-primary btn-transition">
                    <i class="fas fa-sign-in-alt"></i> 立即登录
                </button>
                <button onclick="handleSignUp()" class="btn btn-outline btn-transition">
                    <i class="fas fa-user-plus"></i> 注册新账户
                </button>
                <div style="text-align: center; margin-top: 20px;">
                    <a href="#" onclick="sendPasswordReset()" style="color: var(--text-secondary); font-size: 14px; text-decoration: none;">
                        <i class="fas fa-key"></i> 忘记密码？
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Firebase配置
        const firebaseConfig = {
            apiKey: "AIzaSyC5zQ6We55GvT8xexlQOLPpoTZip9Xac9k",
            authDomain: "slsj-54760.firebaseapp.com",
            databaseURL: "https://slsj-54760-default-rtdb.firebaseio.com",
            projectId: "slsj-54760",
            storageBucket: "slsj-54760.firebasestorage.app",
            messagingSenderId: "890890573955",
            appId: "1:890890573955:web:328c0ed09af23d634b23b6"
        };

        // 初始化Firebase（增加错误保护，避免在移动端脚本加载失败时整页报错）
        let app, auth;
        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
        } catch (e) {
            console.error('Firebase 初始化失败:', e);
            alert('无法连接认证服务，请检查网络或稍后重试。');
        }

        // 页面加载时检查登录状态
        document.addEventListener('DOMContentLoaded', function() {
            // 隐藏加载动画
            document.getElementById('loading').style.display = 'none';
            
            if (!auth) return;

            // 检查用户是否已经登录（增加超时兜底，避免移动端一直停在加载界面）
            let authStateTimeout = setTimeout(() => {
                console.warn('登录状态检查超时。');
                hideLoading();
            }, 8000);

            auth.onAuthStateChanged(user => {
                clearTimeout(authStateTimeout);

                if (user) {
                    // 用户已登录，触发退出转场后跳转到主页面
                    const authContainer = document.querySelector('.auth-container');
                    if (authContainer) {
                        authContainer.classList.remove('auth-page-enter');
                        authContainer.classList.add('auth-page-exit');
                        
                        // 显示加载动画
                        document.getElementById('loading').style.display = 'flex';
                        document.getElementById('loadingText').textContent = '登录成功，正在跳转...';
                    }
                    
                    // 延迟跳转以显示转场效果
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 800); // 增加延迟时间让转场效果更明显
                } else {
                    // 用户未登录，显示登录界面（转场效果已在HTML中设置）
                }
            });
        });

        function showLoading(message = '处理中...') {
            document.getElementById('loadingText').textContent = message;
            document.getElementById('loading').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }

        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }

        async function handleLogin() {
            if (!auth) {
                showError('认证服务不可用，请检查网络或稍后重试。');
                return;
            }
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if (!email || !password) {
                showError('请输入邮箱和密码');
                return;
            }
            
            try {
                showLoading('正在登录...');
                await auth.signInWithEmailAndPassword(email, password);
                // 登录成功，跳转将由onAuthStateChanged处理
            } catch (error) {
                hideLoading();
                handleAuthError(error);
            }
        }

        async function handleSignUp() {
            if (!auth) {
                showError('认证服务不可用，请检查网络或稍后重试。');
                return;
            }
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            
            if (!email || !password) {
                showError('请输入邮箱和密码');
                return;
            }
            
            if (password.length < 6) {
                showError('密码至少需要6位字符');
                return;
            }
            
            try {
                showLoading('正在注册...');
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                // 注册成功，跳转将由onAuthStateChanged处理
            } catch (error) {
                hideLoading();
                handleAuthError(error);
            }
        }

        async function sendPasswordReset() {
            if (!auth) {
                showError('认证服务不可用，请检查网络或稍后重试。');
                return;
            }
            const email = document.getElementById('emailInput').value;
            if (!email) {
                showError('请先输入您的电子邮箱');
                return;
            }
            try {
                showLoading('正在发送重置邮件...');
                await auth.sendPasswordResetEmail(email);
                hideLoading();
                alert('密码重置邮件已发送，请检查您的邮箱');
            } catch (error) {
                hideLoading();
                handleAuthError(error);
            }
        }

        function handleAuthError(error) {
            const errorMap = {
                'auth/invalid-email': '邮箱格式不正确',
                'auth/user-disabled': '账户已被禁用',
                'auth/user-not-found': '该邮箱未注册',
                'auth/wrong-password': '密码错误',
                'auth/email-already-in-use': '邮箱已被注册',
                'auth/operation-not-allowed': '操作不被允许',
                'auth/weak-password': '密码需至少6位',
                'auth/network-request-failed': '网络连接失败，请检查网络'
            };
            showError(errorMap[error.code] || `操作失败: ${error.message}`);
        }

        // 允许回车键登录
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleLogin();
            }
        });
    </script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="css/fontawesome.css">
</body>
</html>
